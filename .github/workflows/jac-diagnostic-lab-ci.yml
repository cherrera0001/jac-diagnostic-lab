name: jac-diagnostic-lab CI

on:
  push:
    paths:
      - "jac-diagnostic-lab/**"
      - ".github/workflows/jac-diagnostic-lab-ci.yml"
  pull_request:
    paths:
      - "jac-diagnostic-lab/**"
      - ".github/workflows/jac-diagnostic-lab-ci.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jac-diagnostic-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
